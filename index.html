<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-FOUC Theme Initialization -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rcn_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Remnant Christian Network | Apostolic Christianity Restored</title>
    <meta name="description" content="Remnant Christian Network (RCN) is an interdenominational ministry striving toward the rebirth of Apostolic Christianity. Join our global community of believers." />
    <meta name="keywords" content="RCN, Remnant Christian Network, Arome Osaghae, Apostolic Christianity, church, sermons, prayer, Nigeria" />
    <meta name="author" content="Remnant Christian Network" />

    <!-- Open Graph -->
    <meta property="og:title" content="Remnant Christian Network" />
    <meta property="og:description" content="Striving toward the rebirth of Apostolic Christianity" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rcnglobal.org" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
